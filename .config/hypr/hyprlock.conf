# hyprlock.conf — themed to match settings.lua
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace

$font = Monospace

# Accent color from active_border_color in settings.lua
$accent     = rgba(00ff9cee)
$accent_dim = rgba(00ff9c88)
$bg_dark    = rgba(1a1a1aee)
$muted      = rgba(595959aa)
$bg_purple  = rgba(2e2837ee)
$text       = rgb(200, 220, 210)

general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    # Mirrors almostLinear bezier from settings.lua
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    # Mirrors easeOutQuint bezier from settings.lua
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn,           1, 1.73, almostLinear
    animation = fadeOut,          1, 1.46, almostLinear
    animation = inputFieldDots,   1, 2,    easeOutQuint
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 3
    brightness = 0.5
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(2e2837ee) # #2e2837 — dark purple-gray

    outer_color = $accent $muted 45deg
    check_color = $accent rgba(00ccffee) 120deg
    fail_color  = rgba(ff4466ee) rgba(ff0066ee) 40deg

    font_color = $text
    fade_on_empty = false
    rounding = 10 # matches decoration.rounding in settings.lua

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    # uncomment if you wish to display a message during authentication
    # check_text = Authenticating...

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    color = $accent
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    color = $accent_dim
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}

label {
    monitor =
    text = $LAYOUT[en,ru]
    color = $accent_dim
    font_size = 24
    onclick = hyprctl switchxkblayout all next

    position = 250, -20
    halign = center
    valign = center
}
