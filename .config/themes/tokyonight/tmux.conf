# Tokyo Night Moon theme. Kept intentionally minimal: colors over status-bar clutter.
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#222436,fg=#c8d3f5"

# Highlight the session box while the prefix is held, before the action key.
set -g status-left "#[fg=#1a1b26,bg=#{?client_prefix,#c3e88d,#82aaff},bold] #S #[fg=#{?client_prefix,#c3e88d,#82aaff},bg=#222436]"
set -g status-left-length 40
set -g status-right "#[fg=#c8d3f5,bold] %Y-%m-%d #[fg=#86e1fc] %H:%M #[fg=#c099ff] #H "
set -g status-right-length 40

# Window tabs: the active window gets a Tokyo Night purple accent.
setw -g window-status-format "#[fg=#828bb8] #I:#W "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#c099ff,bold] #I:#W #[fg=#c099ff,bg=#222436]"

# Tokyo Night accents for panes, prompts, copy mode, and the cursor.
set -g cursor-color "#82aaff"
set -g pane-border-style "fg=#545c7e"
set -g pane-active-border-style "fg=#82aaff"
set -g message-style "bg=#292e42,fg=#c8d3f5"
set -g mode-style "bg=#c3e88d,fg=#1a1b26"
