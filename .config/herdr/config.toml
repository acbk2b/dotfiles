onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[keys]
prefix = "ctrl+space"
# In navigate mode, j/k selects workspaces; arrows move between vertically split panes
navigate_workspace_up = "k"
navigate_workspace_down = "j"
# Swap the focused pane with its neighbour
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

[ui]
pane_gaps = false
pane_outer_borders = false

[ui.toast]
delivery = "system"

# Clear the focused pane (ctrl+l is taken by neovim pane navigation)
[[keys.command]]
key = "ctrl+q"
type = "shell"
command = "herdr pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+l"
