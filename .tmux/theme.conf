# Dracula-inspired theme. Kept intentionally minimal: colors over status-bar clutter.
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#44475a,fg=#f8f8f2"

# Highlight the session box while the prefix is held, before the action key.
set -g status-left "#[fg=#282a36,bg=#{?client_prefix,#50fa7b,#bd93f9},bold] #S #[fg=#{?client_prefix,#50fa7b,#bd93f9},bg=#44475a]"
set -g status-left-length 40
set -g status-right "#[fg=#f8f8f2,bold] %Y-%m-%d #[fg=#8be9fd] %H:%M #[fg=#bd93f9] #H "
set -g status-right-length 40

# Window tabs: active window gets Dracula purple without extra icons.
setw -g window-status-format "#[fg=#6272a4] #I:#W "
setw -g window-status-current-format "#[fg=#282a36,bg=#ff79c6,bold] #I:#W #[fg=#ff79c6,bg=#44475a]"

# Dracula accents for panes, prompts, and copy mode.
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"
set -g message-style "bg=#44475a,fg=#f8f8f2"
set -g mode-style "bg=#50fa7b,fg=#282a36"
